[project]
name = "rag"
version = "0.1.0"
description = "RAG against the machine - 42 project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "fire>=0.6.0",
    "tqdm>=4.66.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.3.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "accelerate>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }   